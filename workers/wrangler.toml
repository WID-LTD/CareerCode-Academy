# Cloudflare Workers config for the CareerCode Academy API.
# Secrets (DATABASE_URL, JWT secrets, gateway keys) are set via
#   wrangler secret put <NAME>
# or .dev.vars locally (gitignored). NEVER commit secrets here.

account_id = "ae5f7e6e4a91cf13a04d8343c445e583"
name = "careercode-academy-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Datastore switch: "d1" (Cloudflare D1) or "neon" (Postgres fallback).
# Override with `wrangler secret put DB_BACKEND` for a no-code rollback.
DB_BACKEND = "d1"
FRONTEND_URL = "https://careercode.com.ng"
CORS_ORIGINS = "https://careercode.com.ng,https://www.careercode.com.ng"
# Public base URL for objects in the R2 media bucket.
R2_PUBLIC_URL = "https://pub-a2269f45348a44958044822fb0428bb7.r2.dev"
JWT_EXPIRES_IN = "15m"
JWT_REFRESH_EXPIRES_IN = "7d"

# --- Primary datastore: Cloudflare D1 (SQLite) ---
# Created with: wrangler d1 create careercode-academy
# Schema + data migration tooling lives in scripts/d1/.
[[d1_databases]]
binding = "DB"
database_name = "careercode-academy"
database_id = "1287fa42-8291-4192-a2c9-47b44b03001b"

# --- R2: database backups (S3-compatible object storage) ---
# Bucket: careercode-backups. Backups are written by scripts/backup-d1.sh.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "careercode-backups"

# --- R2: course media / uploads (same bucket the Express app used) ---
[[r2_buckets]]
binding = "R2"
bucket_name = "career-code-academy"

# --- Durable Objects: AuthDO handles bcrypt (30s CPU budget) ---
[durable_objects]
bindings = [{ name = "AUTH_DO", class_name = "AuthDO" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthDO"]

[env.production.vars]
FRONTEND_URL = "https://careercode.com.ng"
CORS_ORIGINS = "https://careercode.com.ng,https://www.careercode.com.ng"
# Public base URL for objects in the R2 media bucket.
R2_PUBLIC_URL = "https://pub-a2269f45348a44958044822fb0428bb7.r2.dev"

# --- Custom domain (Phase 1 cutover): api.careercode.com.ng ---
[[routes]]
pattern = "api.careercode.com.ng/*"
zone_name = "careercode.com.ng"

# [env.production.hyperdrive]  # uncomment after creating the production Hyperdrive
# binding = "HYPERDRIVE"
# id = "PASTE_PROD_HYPERDRIVE_ID_HERE"
